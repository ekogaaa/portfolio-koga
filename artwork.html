<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork — Erin Koga's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=ranade@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-artwork">
    <header class="site-header">
        <h1>Erin Koga's Portfolio</h1>
        <nav class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="artwork.html" aria-current="page">Artwork</a>
            <a href="videos.html">Videos</a>
            <a href="coding.html">Coding</a>
        </nav>
    </header>
    <main>
        <section class="artwork-section">
            <h2>Glitch Art</h2>
            <div class="artwork-carousel artwork-carousel--glitch" role="region" aria-roledescription="carousel" aria-label="Glitch art gallery">
                <div class="artwork-carousel__viewport">
                    <img src="photos/glitch_image.png" alt="Glitch art: red poppies with horizontal digital distortion" class="artwork-carousel__slide is-active" width="1200" height="800" loading="eager" decoding="async" aria-hidden="false">
                    <img src="photos/glitch_image_2.png" alt="Glitch art: forget-me-not flowers with fragmented color bands" class="artwork-carousel__slide" width="1200" height="800" loading="lazy" decoding="async" aria-hidden="true">
                    <img src="photos/glitch_image_3.png" alt="Glitch art: garden flowers with compression artifacts and color fringing" class="artwork-carousel__slide" width="1200" height="800" loading="lazy" decoding="async" aria-hidden="true">
                </div>
                <div class="artwork-carousel__controls">
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--prev" aria-label="Previous slide">←</button>
                    <p class="artwork-carousel__status" aria-live="polite">1 / 3</p>
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--next" aria-label="Next slide">→</button>
                </div>
            </div>
        </section>
        <section class="artwork-section">
            <h2>Album Cover</h2>
            <div class="artwork-gallery" role="group" aria-label="Album cover">
                <img src="photos/album_cover.png" alt="Album cover design with daisy photograph and glitch effects" width="1200" height="1200" loading="lazy" decoding="async">
            </div>
        </section>
        <section class="artwork-section">
            <h2>Vector Art</h2>
            <div class="artwork-gallery" role="group" aria-label="Vector art gallery">
                <img src="photos/vector_art.png" alt="Vector illustration, chibi character" width="1200" height="900" loading="lazy" decoding="async">
                <img src="photos/vector_art_2.png" alt="Vector illustration, alternate piece" width="1200" height="900" loading="lazy" decoding="async">
            </div>
        </section>
        <section class="artwork-section">
            <h2>Digital Animation</h2>
            <div class="artwork-video">
                <iframe src="https://www.youtube.com/embed/lrahsPfMJ4E" title="Digital animation — YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="artwork-gallery" role="group" aria-label="Animation screenshot">
                <img src="photos/digital_animation_screenshot.png" alt="Visual novel scene with characters and dialogue" width="1200" height="675" loading="lazy" decoding="async">
            </div>
            <div class="artwork-carousel" role="region" aria-roledescription="carousel" aria-label="Character sprites">
                <div class="artwork-carousel__viewport">
                    <img src="photos/sprite_1.png" alt="Character sprite sheet 1 of 5" class="artwork-carousel__slide is-active" width="1200" height="800" loading="eager" decoding="async" aria-hidden="false">
                    <img src="photos/sprite_2.png" alt="Character sprite sheet 2 of 5" class="artwork-carousel__slide" width="1200" height="800" loading="lazy" decoding="async" aria-hidden="true">
                    <img src="photos/sprite_3.png" alt="Character sprite sheet 3 of 5" class="artwork-carousel__slide" width="1200" height="800" loading="lazy" decoding="async" aria-hidden="true">
                    <img src="photos/sprite_4.png" alt="Character sprite sheet 4 of 5" class="artwork-carousel__slide" width="1200" height="800" loading="lazy" decoding="async" aria-hidden="true">
                    <img src="photos/sprite_5.png" alt="Character sprite sheet 5 of 5" class="artwork-carousel__slide" width="1200" height="800" loading="lazy" decoding="async" aria-hidden="true">
                </div>
                <div class="artwork-carousel__controls">
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--prev" aria-label="Previous slide">←</button>
                    <p class="artwork-carousel__status" aria-live="polite">1 / 5</p>
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--next" aria-label="Next slide">→</button>
                </div>
            </div>
        </section>
        <section class="artwork-section">
            <h2>Concept Artwork and Illustration</h2>
            <div class="artwork-carousel artwork-carousel--concept" role="region" aria-roledescription="carousel" aria-label="Concept artwork and illustration">
                <div class="artwork-carousel__viewport">
                    <img src="photos/concept-artwork.png" alt="Character concept sheet: bat humanoid with wings, palette, and reference" class="artwork-carousel__slide is-active" width="1200" height="900" loading="eager" decoding="async" aria-hidden="false">
                    <img src="photos/concept-illustration.png" alt="Illustration: bat humanoid character under moonlit sky" class="artwork-carousel__slide" width="1200" height="900" loading="lazy" decoding="async" aria-hidden="true">
                </div>
                <div class="artwork-carousel__controls">
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--prev" aria-label="Previous slide">←</button>
                    <p class="artwork-carousel__status" aria-live="polite">1 / 2</p>
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--next" aria-label="Next slide">→</button>
                </div>
            </div>
        </section>
        <section class="artwork-section">
            <h2>Coding Concept Artwork</h2>
            <div class="artwork-carousel artwork-carousel--coding" role="region" aria-roledescription="carousel" aria-label="Coding concept artwork">
                <div class="artwork-carousel__viewport">
                    <img src="photos/fish.png" alt="Concept art: humanoid fish character, front view" class="artwork-carousel__slide is-active" width="1200" height="900" loading="eager" decoding="async" aria-hidden="false">
                    <img src="photos/fish_2.png" alt="Concept art: humanoid fish character, profile view" class="artwork-carousel__slide" width="1200" height="900" loading="lazy" decoding="async" aria-hidden="true">
                </div>
                <div class="artwork-carousel__controls">
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--prev" aria-label="Previous slide">←</button>
                    <p class="artwork-carousel__status" aria-live="polite">1 / 2</p>
                    <button type="button" class="artwork-carousel__btn artwork-carousel__btn--next" aria-label="Next slide">→</button>
                </div>
            </div>
        </section>
    </main>
    <script src="js/main.js" defer></script>
</body>
</html>
